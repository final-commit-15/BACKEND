services:
  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    ports:
      - "6379:6379"
    volumes:
      - agentforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentforge-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://agentforge-redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_WEBHOOK_SECRET=${SUPABASE_WEBHOOK_SECRET}
      - BACKEND_URL=${BACKEND_URL}
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn agentforge_backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    networks:
      - default
      - agentforge-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentforge-worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://agentforge-redis:6379/0
      - CELERY_BROKER_URL=redis://agentforge-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://agentforge-redis:6379/2
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A agentforge_backend.workers.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./src:/app/src
    networks:
      - default
      - agentforge-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A agentforge_backend.workers.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  agentforge-network:
    driver: bridge

volumes:
  agentforge_redis_data: